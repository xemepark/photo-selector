# 用 GitHub 的 Mac 主機編譯 macOS 安裝檔（.dmg）
#
# - 一般推送（測試版）：Apple Silicon 與 Intel 兩台主機「同時」編譯（不跑單元測試，推送前已在開發環境測過），
#   最後合併成一個通用版 .dmg，兩種 Mac 都能用同一個網址下載安裝
# - v 開頭的標籤（正式版）：跑完整單元測試，以 tauri 直接編通用版（支援正式簽署與公證）
#
# - 每次推送都會編譯，並更新固定的測試版下載連結（不需登入 GitHub）：
#   https://github.com/xemepark/photo-selector/releases/download/beta/Photo-Selector-mac-universal.dmg
#   也可在該次執行的「Artifacts」區下載
# - 推送 v 開頭的標籤（例如 v0.2.0）會另外建立 GitHub Release 並附上 .dmg
# - 若在 repo 的 Secrets 設定了 Apple 開發者憑證，會自動正式簽署與公證（見 README）；
#   沒設定時使用 ad-hoc 簽署，第一次開啟需要到「系統設定 → 隱私權與安全性」允許
name: Build macOS

on:
  push:
    # beta-dmg 只放安裝檔（由下方步驟自動更新），不需要編譯
    branches: ["**", "!beta-dmg"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macos-${{ github.ref }}
  # 新的推送排隊等前一次完成，不中斷（保留編譯快取，第二次之後快很多）
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- 正式版（v* 標籤）
  macos:
    if: github.ref_type == 'tag'
    # 指定 macos-15（Apple Silicon）：macos-latest 曾發生長時間分配不到機器；macos-14 已無法使用
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 編譯目標
        run: |
          echo "TARGET=universal-apple-darwin" >> "$GITHUB_ENV"
          echo "TARGET_DESC=Apple Silicon + Intel 通用版" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          # 不另設 key：通用版的快取本來就包含 target/aarch64-apple-darwin，可以直接沿用
          workspaces: src-tauri

      - name: 安裝前端套件
        run: npm ci

      - name: 後端單元測試（含人臉模型）
        run: cargo test --release --manifest-path src-tauri/Cargo.toml

      - name: 設定 Apple 簽署憑證（有設定 Secrets 才會啟用）
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            echo "使用正式 Apple 開發者憑證簽署"
            for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              if [ -n "${!v}" ]; then
                { echo "$v<<__EOF__"; echo "${!v}"; echo "__EOF__"; } >> "$GITHUB_ENV"
              fi
            done
          else
            echo "未設定 Apple 憑證，使用 ad-hoc 簽署"
          fi

      - name: 編譯（${{ env.TARGET_DESC }}）
        env:
          BUILD_SHA: ${{ github.sha }}
        run: npx tauri build --target "$TARGET" --bundles app,dmg

      - name: 整理安裝檔
        id: dmg
        run: |
          DMG=$(ls src-tauri/target/$TARGET/release/bundle/dmg/*.dmg | head -1)
          OUT="Photo-Selector-${GITHUB_REF_NAME//\//-}-mac.dmg"
          cp "$DMG" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          APP=$(ls -d src-tauri/target/$TARGET/release/bundle/macos/*.app | head -1)
          echo "App: $APP"
          lipo -info "$APP/Contents/MacOS/"*
          codesign -dv "$APP" 2>&1 | head -5
          ls -lh "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Photo-Selector-macOS
          path: ${{ steps.dmg.outputs.path }}
          retention-days: 30

      - name: 建立 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.dmg.outputs.path }}" --title "小日子寫真館 $GITHUB_REF_NAME" --generate-notes

  # ---------------------------------------------------------------- 測試版（分支推送）：兩種晶片同時編譯
  beta-build:
    if: github.ref_type == 'branch'
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        arch: [aarch64, x86_64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.arch }}

      - name: 安裝前端套件
        run: npm ci

      - name: 編譯 ${{ matrix.arch }}
        env:
          BUILD_SHA: ${{ github.sha }}
        run: npx tauri build --target ${{ matrix.arch }}-apple-darwin --bundles app

      - name: 打包 .app
        run: |
          cd src-tauri/target/${{ matrix.arch }}-apple-darwin/release/bundle/macos
          ls -d *.app
          lipo -info *.app/Contents/MacOS/*
          tar -czf "$GITHUB_WORKSPACE/app-${{ matrix.arch }}.tgz" *.app

      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.arch }}
          path: app-${{ matrix.arch }}.tgz
          retention-days: 3

  beta-publish:
    if: github.ref_type == 'branch'
    needs: beta-build
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: app-*

      - name: 合併成通用版（lipo）並製作 .dmg
        id: dmg
        run: |
          set -e
          mkdir arm x86 dmgroot
          tar -xzf app-aarch64/app-aarch64.tgz -C arm
          tar -xzf app-x86_64/app-x86_64.tgz -C x86
          APP=$(cd arm && ls -d *.app | head -1)
          cp -R "arm/$APP" "dmgroot/$APP"
          for bin in "arm/$APP/Contents/MacOS/"*; do
            name=$(basename "$bin")
            lipo -create "$bin" "x86/$APP/Contents/MacOS/$name" -output "dmgroot/$APP/Contents/MacOS/$name"
          done
          lipo -info "dmgroot/$APP/Contents/MacOS/"*
          codesign --force --deep --sign - "dmgroot/$APP"
          codesign --verify --deep --strict "dmgroot/$APP"
          ln -s /Applications dmgroot/Applications
          # hdiutil 自動估算映像檔大小時偶爾會估太小（No space left on device）→ 明確指定大小並留餘裕
          SIZE=$(( $(du -sm dmgroot | cut -f1) * 13 / 10 + 40 ))
          for try in 1 2 3; do
            hdiutil create -volname "小日子寫真館" -srcfolder dmgroot -fs HFS+ -size "${SIZE}m" -ov -format UDZO Photo-Selector-mac-universal.dmg && break
            echo "hdiutil 失敗（第 $try 次），加大後重試"; SIZE=$(( SIZE + 80 )); sleep 3
          done
          test -f Photo-Selector-mac-universal.dmg
          ls -lh Photo-Selector-mac-universal.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: Photo-Selector-macOS
          path: Photo-Selector-mac-universal.dmg
          retention-days: 30

      - name: 更新測試版下載連結
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete beta --yes --cleanup-tag -R "$GITHUB_REPOSITORY" 2>/dev/null || true
          sleep 5
          gh release create beta Photo-Selector-mac-universal.dmg -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease \
            --title "小日子寫真館 測試版（最新）" \
            --notes "自動編譯的最新測試版（${GITHUB_SHA::7}，分支 ${GITHUB_REF_NAME}）。Apple Silicon + Intel 通用版，macOS 11 以上。尚未經 Apple 公證，第一次開啟請見 README「在 Mac 上安裝」。"

      - name: 安裝檔另存到 beta-dmg 分支（只保留最新一份，方便自動上傳到雲端硬碟）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir dmgbranch && cd dmgbranch
          git init -q
          git checkout -q -b beta-dmg
          cp ../Photo-Selector-mac-universal.dmg .
          printf '%s\n' "commit ${GITHUB_SHA}" "branch ${GITHUB_REF_NAME}" "built $(date -u +%Y-%m-%dT%H:%M:%SZ)" > VERSION.txt
          git add Photo-Selector-mac-universal.dmg VERSION.txt
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "測試版安裝檔 ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" beta-dmg
