# 用 GitHub 的 Mac 主機編譯 macOS 安裝檔（.dmg，Apple Silicon + Intel 通用版）
#
# - 每次推送都會編譯，並更新固定的測試版下載連結（不需登入 GitHub）：
#   https://github.com/xemepark/photo-selector/releases/download/beta/Photo-Selector-mac-universal.dmg
#   也可在該次執行的「Artifacts」區下載
# - 推送 v 開頭的標籤（例如 v0.2.0）會另外建立 GitHub Release 並附上 .dmg
# - 若在 repo 的 Secrets 設定了 Apple 開發者憑證，會自動正式簽署與公證（見 README）；
#   沒設定時使用 ad-hoc 簽署，第一次開啟需要到「系統設定 → 隱私權與安全性」允許
name: Build macOS

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macos-${{ github.ref }}
  # 新的推送排隊等前一次完成，不中斷（保留編譯快取，第二次之後快很多）
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安裝前端套件
        run: npm ci

      - name: 後端單元測試（含人臉模型）
        run: cargo test --release --manifest-path src-tauri/Cargo.toml

      - name: 設定 Apple 簽署憑證（有設定 Secrets 才會啟用）
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            echo "使用正式 Apple 開發者憑證簽署"
            for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              if [ -n "${!v}" ]; then
                { echo "$v<<__EOF__"; echo "${!v}"; echo "__EOF__"; } >> "$GITHUB_ENV"
              fi
            done
          else
            echo "未設定 Apple 憑證，使用 ad-hoc 簽署"
          fi

      - name: 編譯通用版（Apple Silicon + Intel）
        env:
          BUILD_SHA: ${{ github.sha }}
        run: npx tauri build --target universal-apple-darwin --bundles app,dmg

      - name: 整理安裝檔
        id: dmg
        run: |
          DMG=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          OUT="Photo-Selector-${GITHUB_REF_NAME//\//-}-mac-universal.dmg"
          cp "$DMG" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          APP=$(ls -d src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app | head -1)
          echo "App: $APP"
          lipo -info "$APP/Contents/MacOS/"*
          codesign -dv "$APP" 2>&1 | head -5
          ls -lh "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Photo-Selector-macOS
          path: ${{ steps.dmg.outputs.path }}
          retention-days: 30

      - name: 建立 Release（僅限 v* 標籤）
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.dmg.outputs.path }}" --title "小日子寫真館 $GITHUB_REF_NAME" --generate-notes

      - name: 更新測試版下載連結（branch 推送時）
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "${{ steps.dmg.outputs.path }}" Photo-Selector-mac-universal.dmg
          gh release delete beta --yes --cleanup-tag -R "$GITHUB_REPOSITORY" 2>/dev/null || true
          sleep 5
          gh release create beta Photo-Selector-mac-universal.dmg -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease \
            --title "小日子寫真館 測試版（最新）" \
            --notes "自動編譯的最新測試版（${GITHUB_SHA::7}，分支 ${GITHUB_REF_NAME}）。Apple Silicon + Intel 通用版，macOS 11 以上。尚未經 Apple 公證，第一次開啟請見 README「在 Mac 上安裝」。"
