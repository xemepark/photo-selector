# 用 GitHub 的 Mac 主機編譯 macOS 安裝檔（.dmg）
#
# - 一般推送（測試版）：一台主機依序編譯 Apple Silicon 與 Intel，合併成通用版 .dmg（不跑單元測試，推送前已在開發環境測過）。
#   不用兩台主機平行：GitHub 的 Mac 主機常常湊不齊兩台，第二台排隊超過 15 分鐘就會被取消
# - v 開頭的標籤（正式版）：跑完整單元測試，以 tauri 直接編通用版（支援正式簽署與公證）
#
# - 每次推送都會編譯，並更新固定的測試版下載連結（不需登入 GitHub）：
#   https://github.com/xemepark/photo-selector/releases/download/beta/Photo-Selector-mac-universal.dmg
#   也可在該次執行的「Artifacts」區下載
# - 推送 v 開頭的標籤（例如 v0.2.0）會另外建立 GitHub Release 並附上 .dmg
# - 若在 repo 的 Secrets 設定了 Apple 開發者憑證，會自動正式簽署與公證（見 README）；
#   沒設定時使用 ad-hoc 簽署，第一次開啟需要到「系統設定 → 隱私權與安全性」允許
name: Build macOS

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macos-${{ github.ref }}
  # 新的推送排隊等前一次完成，不中斷（保留編譯快取，第二次之後快很多）
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- 正式版（v* 標籤）
  macos:
    if: github.ref_type == 'tag'
    # 指定 macos-15（Apple Silicon）：macos-latest 曾發生長時間分配不到機器；macos-14 已無法使用
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 編譯目標
        run: |
          echo "TARGET=universal-apple-darwin" >> "$GITHUB_ENV"
          echo "TARGET_DESC=Apple Silicon + Intel 通用版" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          # 不另設 key：通用版的快取本來就包含 target/aarch64-apple-darwin，可以直接沿用
          workspaces: src-tauri

      - name: 安裝前端套件
        run: npm ci

      - name: 後端單元測試（含人臉模型）
        run: cargo test --release --manifest-path src-tauri/Cargo.toml

      - name: 設定 Apple 簽署憑證（有設定 Secrets 才會啟用）
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            echo "使用正式 Apple 開發者憑證簽署"
            for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              if [ -n "${!v}" ]; then
                { echo "$v<<__EOF__"; echo "${!v}"; echo "__EOF__"; } >> "$GITHUB_ENV"
              fi
            done
          else
            echo "未設定 Apple 憑證，使用 ad-hoc 簽署"
          fi

      # 沒有 Apple 開發者憑證時，用自製憑證（Secret：MAC_SIGN_P12）簽署：
      # 每一版的簽章身分相同，macOS 的螢幕錄影等權限更新後不用重新設定（ad-hoc 簽署每版都不同）
      - name: 設定固定簽章（自製憑證）
        env:
          MAC_SIGN_P12: ${{ secrets.MAC_SIGN_P12 }}
        run: |
          if [ -n "$APPLE_SIGNING_IDENTITY" ]; then echo "已有 Apple 憑證，略過"; exit 0; fi
          if [ -z "$MAC_SIGN_P12" ]; then echo "未設定 MAC_SIGN_P12，使用 ad-hoc 簽署"; exit 0; fi
          NAME="Smallday Photo Selector"
          KC="$RUNNER_TEMP/selfsign.keychain-db"
          PW=$(uuidgen)
          echo "$MAC_SIGN_P12" | base64 --decode > "$RUNNER_TEMP/sign.p12"
          security create-keychain -p "$PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$PW" "$KC"
          security import "$RUNNER_TEMP/sign.p12" -k "$KC" -P photoselector -T /usr/bin/codesign -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$PW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-certificate -c "$NAME" -p "$KC" > "$RUNNER_TEMP/sign.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/sign.pem" \
            || sudo security add-trusted-cert -d -r trustAsRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/sign.pem" || true
          rm -f "$RUNNER_TEMP/sign.p12"
          security find-identity -p codesigning "$KC"
          # 先試簽一個檔案，確定憑證可用；不能用就退回 ad-hoc，不讓整個編譯失敗
          cp /bin/echo "$RUNNER_TEMP/signtest"
          if codesign -s "$NAME" --keychain "$KC" "$RUNNER_TEMP/signtest"; then
            echo "使用自製憑證「$NAME」簽署"
            echo "APPLE_SIGNING_IDENTITY=$NAME" >> "$GITHUB_ENV"
          else
            echo "::warning::自製憑證無法簽署，改用 ad-hoc"
          fi

      - name: 編譯（${{ env.TARGET_DESC }}）
        env:
          BUILD_SHA: ${{ github.sha }}
        run: npx tauri build --target "$TARGET" --bundles app,dmg

      - name: 整理安裝檔
        id: dmg
        run: |
          DMG=$(ls src-tauri/target/$TARGET/release/bundle/dmg/*.dmg | head -1)
          OUT="Photo-Selector-${GITHUB_REF_NAME//\//-}-mac.dmg"
          cp "$DMG" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          APP=$(ls -d src-tauri/target/$TARGET/release/bundle/macos/*.app | head -1)
          echo "App: $APP"
          lipo -info "$APP/Contents/MacOS/"*
          codesign -dv "$APP" 2>&1 | head -5
          ls -lh "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Photo-Selector-macOS
          path: ${{ steps.dmg.outputs.path }}
          retention-days: 30

      - name: 建立 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.dmg.outputs.path }}" --title "小日子寫真館 $GITHUB_REF_NAME" --generate-notes

  # ---------------------------------------------------------------- 測試版（分支推送）
  beta:
    if: github.ref_type == 'branch'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: universal

      - name: 安裝前端套件
        run: npm ci

      # 版本號 = 0.1.<第幾次編譯>（每次推送加一），軟體左下角與安裝檔檔名使用同一個號碼
      - name: 版本號
        run: |
          BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          echo "APP_VERSION=$BASE.${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(TZ=Asia/Taipei date +%Y%m%d)" >> "$GITHUB_ENV"

      # 沒有 Apple 開發者憑證時，用自製憑證（Secret：MAC_SIGN_P12）簽署：
      # 每一版的簽章身分相同，macOS 的螢幕錄影等權限更新後不用重新設定（ad-hoc 簽署每版都不同）
      - name: 設定固定簽章（自製憑證）
        env:
          MAC_SIGN_P12: ${{ secrets.MAC_SIGN_P12 }}
        run: |
          if [ -n "$APPLE_SIGNING_IDENTITY" ]; then echo "已有 Apple 憑證，略過"; exit 0; fi
          if [ -z "$MAC_SIGN_P12" ]; then echo "未設定 MAC_SIGN_P12，使用 ad-hoc 簽署"; exit 0; fi
          NAME="Smallday Photo Selector"
          KC="$RUNNER_TEMP/selfsign.keychain-db"
          PW=$(uuidgen)
          echo "$MAC_SIGN_P12" | base64 --decode > "$RUNNER_TEMP/sign.p12"
          security create-keychain -p "$PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$PW" "$KC"
          security import "$RUNNER_TEMP/sign.p12" -k "$KC" -P photoselector -T /usr/bin/codesign -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$PW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-certificate -c "$NAME" -p "$KC" > "$RUNNER_TEMP/sign.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/sign.pem" \
            || sudo security add-trusted-cert -d -r trustAsRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/sign.pem" || true
          rm -f "$RUNNER_TEMP/sign.p12"
          security find-identity -p codesigning "$KC"
          # 先試簽一個檔案，確定憑證可用；不能用就退回 ad-hoc，不讓整個編譯失敗
          cp /bin/echo "$RUNNER_TEMP/signtest"
          if codesign -s "$NAME" --keychain "$KC" "$RUNNER_TEMP/signtest"; then
            echo "使用自製憑證「$NAME」簽署"
            echo "APPLE_SIGNING_IDENTITY=$NAME" >> "$GITHUB_ENV"
          else
            echo "::warning::自製憑證無法簽署，改用 ad-hoc"
          fi

      - name: 編譯通用版（Apple Silicon + Intel）
        env:
          BUILD_SHA: ${{ github.sha }}
          BUILD_VERSION: ${{ env.APP_VERSION }}
        run: npx tauri build --target universal-apple-darwin --bundles app,dmg

      - name: 整理安裝檔
        run: |
          DMG=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          OUT="Photo-Selector-v${APP_VERSION}-${BUILD_DATE}.dmg"
          cp "$DMG" "$OUT"
          # 固定檔名的複本：舊的下載連結（使用手冊、安裝說明）一樣能下載到最新版
          cp "$DMG" Photo-Selector-mac-universal.dmg
          echo "DMG_NAME=$OUT" >> "$GITHUB_ENV"
          lipo -info src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app/Contents/MacOS/*
          codesign -dv src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app 2>&1 | head -8
          codesign -d -r- src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app 2>&1 | tail -2
          ls -lh "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DMG_NAME }}
          path: ${{ env.DMG_NAME }}
          retention-days: 30

      - name: 更新測試版下載連結
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete beta --yes --cleanup-tag -R "$GITHUB_REPOSITORY" 2>/dev/null || true
          sleep 5
          gh release create beta "$DMG_NAME" Photo-Selector-mac-universal.dmg -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease \
            --title "小日子寫真館 測試版 v${APP_VERSION}" \
            --notes "自動編譯的最新測試版 v${APP_VERSION}（${BUILD_DATE}，${GITHUB_SHA::7}，分支 ${GITHUB_REF_NAME}）。Apple Silicon + Intel 通用版，macOS 11 以上。尚未經 Apple 公證，第一次開啟請見 README「在 Mac 上安裝」。"
